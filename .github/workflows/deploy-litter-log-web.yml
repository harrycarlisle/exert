name: Deploy Litter Log Web

on:
  push:
    branches: [main]
    paths:
      - 'LitterLogWeb/**'
      - '.github/workflows/deploy-litter-log-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LitterLogWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LitterLogWeb/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build for GitHub Pages
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:pages

      - name: Prepare Pages static files
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Built index.html asset refs:"
          grep -E 'src=|href=' dist/index.html
          echo "Manifest:"
          cat dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/apple-touch-icon.png
          test -f dist/version.json
          echo "version.json:"
          cat dist/version.json
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          grep -q "$GITHUB_SHA" dist/version.json
          grep -q "$SHORT_SHA" dist/version.json
          # version.json must never appear in the Workbox precache URL list.
          if grep -oE '"url":"[^"]+"' dist/sw.js | grep -q 'version\.json'; then
            echo "version.json must not be precached by the service worker" >&2
            exit 1
          fi
          # Runtime caching should use NetworkOnly (covers version.json).
          if ! grep -qi 'NetworkOnly' dist/sw.js; then
            echo "Expected NetworkOnly runtime caching in sw.js for version.json" >&2
            exit 1
          fi
          # Fail if any root-absolute asset paths (missing /exert/) remain in HTML.
          if grep -E ' (src|href)="/(assets|icons|manifest|sw|favicon|apple)' dist/index.html; then
            echo "Found root-absolute asset paths that will break /exert/ hosting" >&2
            exit 1
          fi
          # Fail if SW still binds navigation to root /index.html
          if grep -q 'createHandlerBoundToURL("/index.html")' dist/sw.js; then
            echo "Service worker navigateFallback is root /index.html; expected /exert/index.html" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to the repository root (not working-directory).
          path: LitterLogWeb/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
