name: Deploy Litter Log Web

on:
  push:
    branches: [main, cursor/litter-log-web-pwa-1b62]
    paths:
      - 'LitterLogWeb/**'
      - '.github/workflows/deploy-litter-log-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LitterLogWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LitterLogWeb/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Project Pages are served under /<repo>/
          BASE_PATH: /exert/
      - name: Ensure no Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: LitterLogWeb/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
